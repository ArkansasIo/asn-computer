name: ASN Computer Portable Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q emulator_simulator.py tools tests v2026/python
      - name: Run legacy CPU self-test
        run: python tools/altair8080.py --self-test
      - name: Run legacy regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test ALTAIR 2026 Python reference
        working-directory: v2026
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python python/altair2026.py --self-test
