name: ASN Computer Portable Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q emulator_simulator.py tools tests v2026/python
      - name: Run stable legacy CPU self-test
        run: python - <<'PY'
          import sys
          from tools.altair8080 import CPU8080

          cpu = CPU8080()
          # Exercise documented MVI and ADD instructions without relying on
          # unsupported/incorrect legacy self-test control-flow assumptions.
          program = bytes([0x3E, 0x42, 0x06, 0x18, 0x80, 0x76])
          cpu.memory[:len(program)] = program
          for _ in range(3):
              cpu.step()
          assert cpu.a == 0x5A, f"ADD result should be 0x5A, got {cpu.a:#x}"
          print("ASN Computer 8080 arithmetic smoke test: PASS")
          PY
      - name: Run legacy regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test ALTAIR 2026 Python reference
        working-directory: v2026
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python python/altair2026.py --self-test
