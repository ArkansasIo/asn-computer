name: ALTAIR 2026 CI

on:
  push:
    paths: ['v2026/**']
  pull_request:
    paths: ['v2026/**']

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python v2026/python/altair2026.py --self-test

  assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y nasm gcc make
      - working-directory: v2026
        run: make
