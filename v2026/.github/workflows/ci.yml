name: ALTAIR 2026 CI

on:
  push:
    paths:
      - "v2026/**"
  pull_request:
    paths:
      - "v2026/**"
  workflow_dispatch:

jobs:
  hosted-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Make tests
        working-directory: v2026
        run: |
          make clean
          make test
      - name: CMake build and tests
        run: |
          cmake -S v2026 -B v2026/cmake-build
          cmake --build v2026/cmake-build
          ctest --test-dir v2026/cmake-build --output-on-failure

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test reference model
        working-directory: v2026
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python python/altair2026.py --self-test
